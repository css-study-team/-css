<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    body{
        background-color: #f0f0f0;
        padding: 40px;
        }
    .card{
        background-color: white;
        width: 280px;
        border-radius: 16px;
        border: 1px solid #ddd;
        padding: 32px;
        margin: auto; }
    .card h2{
        font-size: 24px;
        color: #222;
        text-align: center;
        }
    .role{
         font-size: 14px;
         color: #888;
         text-align: center;
 }
    ul{
        list-style: none;
        padding:0;
      }
    .card a{
        text-decoration: none;
        background-color: #4361ee;
        color:white;
        padding: 10px;
        border-radius: 8px;
        text-align: center;
        display: block;
    }
    .card a:hover{
        background-color: #2a3eb1;

    }
   </style>
</head>
<body>
    <div class="card">
     <h2>홍길동</h2>
     <p class="role"> 프론트엔드 개발자</p>
     <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>

     </ul>
     <a href="#"> 깃허브 가기</a>
    </div>
</body>
</html>
